<title>Cohby Currency</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(900px 480px at 50% -8%,rgba(99,102,241,.16),transparent 65%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 7px 18px rgba(99,102,241,.35)}
h1{font-size:18px;margin:0;letter-spacing:-.3px;font-weight:750}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:21px;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .12s}
.icon-btn:active{transform:scale(.93);background:var(--chip)}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.status.offline .dot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.field{background:var(--input);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.field-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.field-top label,.results-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.hint{font-size:11px;color:var(--muted)}
.field-row{display:flex;align-items:center;gap:8px}
.amt{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:32px;font-weight:750;letter-spacing:-.6px;width:100%;font-variant-numeric:tabular-nums;padding:0}
.amt::placeholder{color:var(--muted);opacity:.45}
.curr{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px;flex-shrink:0;max-width:56%}
.curr select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-weight:750;max-width:140px;cursor:pointer;padding:6px 2px;text-align:right;direction:rtl}
.curr select option,.rsel option{background:var(--card);color:var(--text);direction:ltr}
.swap-wrap{height:10px;position:relative;z-index:2}
.swap-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:4px solid var(--card);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(99,102,241,.38);display:grid;place-items:center;transition:transform .15s;line-height:1}
.swap-btn:active{transform:translate(-50%,-50%) scale(.88) rotate(180deg)}
.results-head{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 9px}
.badge{background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--input);border:1px solid var(--line);border-radius:15px;padding:10px 13px;margin-bottom:8px}
.rrow:last-child{margin-bottom:0}
.rleft{display:flex;flex-direction:column;gap:2px;min-width:0}
.rsel{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;font-weight:750;padding:2px 0;cursor:pointer;min-width:96px}
.rname{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.rright{text-align:right;min-width:0}
.ramt{font-size:22px;font-weight:750;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrate{font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quick{display:flex;gap:8px;margin-top:14px}
.quick button{flex:1;padding:11px 0;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;transition:transform .1s,background .1s}
.quick button:active{background:var(--chip);transform:scale(.96)}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.8}
.copy{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
footer a{color:var(--accent);text-decoration:none}
@media (min-width:520px){.app{padding-top:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

}
function setStatus(){
  const s = $("status");
  s.className = "status" + (live ? "" : " offline");
  s.innerHTML = '<span class="dot"></span> ' + (live ? "Live rates · updated " + updated : "Offline · saved rates from " + updated);
}
function computeAll(){
  const amt = parseFloat(fromAmt.value.replace(/,/g, "")) || 0;
  const f = fromCur.value;
  if(!rates[f]) return;
  sels.forEach((sel, i) => {
    const t = sel.value;
    if(!rates[t]) return;
    const r = rates[t] / rates[f];
    $("rAmt" + i).textContent = fmt((amt / rates[f]) * rates[t]);
    $("rRate" + i).textContent = "1 " + f + " = " + rateFmt(r) + " " + t;
    $("rName" + i).textContent = nameOf(t);
  });
  $("fromName").textContent = nameOf(f);
}
function clean(el){
  let v = el.value.replace(/[^\d.]/g, "");
  const p = v.indexOf(".");
  if(p !== -1) v = v.slice(0, p + 1) + v.slice(p + 1).replace(/\./g, "");
  if(v.length > 18) v = v.slice(0, 18);
  el.value = v;
}
function savePrefs(){
  try{ localStorage.setItem(KEY + "-prefs", JSON.stringify({ from:fromCur.value, to:sels.map(s => s.value), amt:fromAmt.value })); }catch(e){}
}
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(KEY + "-prefs")) || {}; }catch(e){ return {}; } }
function loadCache(){
  try{
    const c = JSON.parse(localStorage.getItem(KEY));
    if(c && c.rates && Object.keys(c.rates).length > 10){ rates = c.rates; updated = c.updated || ""; live = false; }
    else throw 0;
  }catch(e){ rates = FALLBACK.rates; updated = prettyDate(FALLBACK.date); live = false; }
}
async function fetchRates(){
  const btn = $("refreshBtn");
  btn.classList.add("spin");
  try{
    const res = await fetch(API, { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if(d.result !== "success" || !d.rates || !d.rates.USD) throw new Error("bad data");
    rates = d.rates; updated = prettyDate(d.time_last_update_utc); live = true;
    const f = fromCur.value, ts = sels.map(s => s.value);
    buildSelect(fromCur, rates[f] ? f : "USD", false);
    sels.forEach((s, i) => buildSelect(s, rates[ts[i]] ? ts[i] : ["EUR","GBP","JPY"][i] || Object.keys(rates)[i], true));
    try{ localStorage.setItem(KEY, JSON.stringify({ rates:rates, updated:updated, saved:Date.now() })); }catch(e){}
  }catch(e){
    loadCache();
    const f = fromCur.value, ts = sels.map(s => s.value);
    buildSelect(fromCur, rates[f] ? f : "USD", false);
    sels.forEach((s, i) => buildSelect(s, rates[ts[i]] ? ts[i] : ["EUR","GBP","JPY"][i] || Object.keys(rates)[i], true));
  }finally{
    btn.classList.remove("spin");
    validCodes(); snapshotPrev(); setStatus(); computeAll();
  }
}
function onFromChange(){
  const v = fromCur.value;
  const j = sels.findIndex(s => s.value === v);
  if(j !== -1){ sels[j].value = prevFrom; prevTo[j] = prevFrom; }
  prevFrom = v; validCodes(); snapshotPrev(); computeAll(); savePrefs();
}
function onToChange(i){
  const v = sels[i].value, old = prevTo[i];
  if(v === fromCur.value){ fromCur.value = old; prevFrom = fromCur.value; }
  else{
    const j = sels.findIndex((s, k) => k !== i && s.value === v);
    if(j !== -1){ sels[j].value = old; prevTo[j] = old; }
  }
  prevTo[i] = v; validCodes(); snapshotPrev(); computeAll(); savePrefs();
}
fromAmt.addEventListener("input", () => { clean(fromAmt); computeAll(); savePrefs(); });
fromCur.addEventListener("change", onFromChange);
sels.forEach((s, i) => s.addEventListener("change", () => onToChange(i)));
$("swapBtn").addEventListener("click", () => {
  const f = fromCur.value;
  fromCur.value = sels[0].value;
  sels[0].value = f;
  validCodes(); snapshotPrev(); computeAll(); savePrefs();
});
$("refreshBtn").addEventListener("click", fetchRates);
document.querySelectorAll(".quick button").forEach(b => b.addEventListener("click", () => { fromAmt.value = b.dataset.amt; computeAll(); savePrefs(); }));
window.addEventListener("online", fetchRates);

(function init(){
  loadCache();
  const p = loadPrefs();
  const f = p.from && rates[p.from] ? p.from : (rates.USD ? "USD" : Object.keys(rates)[0]);
  const defaults = ["EUR", "GBP", "JPY"];
  buildSelect(fromCur, f, false);
  sels.forEach((s, i) => buildSelect(s, p.to && p.to[i] && rates[p.to[i]] ? p.to[i] : defaults[i], true));
  fromAmt.value = p.amt || "100";
  validCodes(); snapshotPrev(); setStatus(); computeAll();
  fetchRates();
  setInterval(fetchRates, 30 * 60 * 1000);
})();
</script>
</body>
</html>
