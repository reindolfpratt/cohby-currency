<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf1ff">
<meta name="description" content="Cohby Currency — a soft, simple converter showing one amount in three currencies at once.">
<title>Cohby Currency</title>
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --bg1:#e9f1ff; --bg2:#f3f2f8; --bg3:#f8f7fb;
  --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#e8ecf4;
  --text:#151b2b; --muted:#8590a4; --line:rgba(21,27,43,.055);
  --accent:#2f6fed; --accent-soft:#e9f1ff; --accent-line:rgba(47,111,237,.28);
  --glass:rgba(255,255,255,.58); --overlay:rgba(24,32,50,.34);
  --shadow:0 18px 50px rgba(43,58,100,.10); --sheet-shadow:0 -18px 50px rgba(28,40,70,.16);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg1:#131b2d; --bg2:#171e2c; --bg3:#1a2030;
    --surface:#1e2635; --surface-2:#252e40; --surface-3:#313c51;
    --text:#edf1f8; --muted:#98a4b9; --line:rgba(255,255,255,.07);
    --accent:#7ba4ff; --accent-soft:#263a61; --accent-line:rgba(123,164,255,.35);
    --glass:rgba(30,38,53,.68); --overlay:rgba(4,7,14,.62);
    --shadow:0 18px 50px rgba(0,0,0,.38); --sheet-shadow:0 -18px 50px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(700px 360px at 50% -6%,rgba(120,165,255,.20),transparent 70%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 58%,var(--bg3) 100%);
  background-attachment:fixed;
  color:var(--text);font-family:var(--sans);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 26px)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.menu{width:42px;height:42px;border-radius:50%;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);font-size:18px;flex-shrink:0;cursor:pointer;transition:opacity .15s,transform .12s}
.menu:active{transform:scale(.93)}
.brand-text{flex:1;min-width:0}
h1{font-size:17px;margin:0;letter-spacing:-.3px;font-weight:650}
.sub{font-size:11px;color:var(--muted);margin:3px 0 0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(47,111,237,.26);flex-shrink:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--muted);margin-bottom:13px;max-width:100%}
.dot{width:6px;height:6px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.16);flex-shrink:0}
.status.offline .dot{background:#f0a737;box-shadow:0 0 0 3px rgba(240,167,55,.16)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px 16px;box-shadow:var(--shadow)}
.row-head{display:flex;justify-content:space-between;align-items:center;margin:0 5px 10px}
.row-head label,.results-head .title{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.1px}
.hint{font-size:11px;color:var(--muted)}
.send-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:15px 13px}
.amt{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-1px;width:100%;font-variant-numeric:tabular-nums;padding:0;text-align:right}
.amt::placeholder{color:var(--muted);opacity:.5}
.cur-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 11px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 8px rgba(25,40,80,.05);transition:transform .12s,border-color .12s,background .12s}
.cur-pill:active{transform:scale(.96)}
.cur-pill.active{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.cur-pill .flag{font-size:18px;line-height:1}
.cur-pill .code{font-family:var(--mono);letter-spacing:.2px}
.cur-pill .chev{font-size:9px;color:var(--muted);margin-left:1px}
.cur-pill{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.cur-pill.is-dragging{opacity:.32}
body.dragging-active{cursor:grabbing}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 14px 30px rgba(30,50,95,.24);opacity:.97;margin:0}
.drag-ghost.ghost-out{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:opacity .16s,transform .16s}
.send-row,.rrow{transition:background .15s,box-shadow .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
.send-row.drop-active,.rrow.drop-active{outline-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px rgba(47,111,237,.08)}
.send-row.flash,.rrow.flash{animation:flashswap .55s ease}
@keyframes flashswap{0%{background:var(--accent-soft);outline-color:var(--accent)}100%{background:var(--surface-2);outline-color:transparent}}
.swap-wrap{height:12px;position:relative;z-index:2}
.swap-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 20px rgba(30,45,85,.14);color:var(--accent);font-size:19px;font-weight:700;display:grid;place-items:center;cursor:pointer;transition:transform .15s;line-height:1}
.swap-btn:active{transform:translate(-50%,-50%) scale(.88) rotate(180deg)}
.results-head{display:flex;align-items:center;justify-content:space-between;margin:6px 5px 12px}
.badge{background:var(--surface-3);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:10px;font-weight:650}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:12px 13px;margin-bottom:9px}
.rrow:last-child{margin-bottom:0}
.rright{text-align:right;min-width:0}
.ramt{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.6px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.rrate{font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quick{display:flex;gap:8px;margin-top:13px}
.quick button{flex:1;padding:11px 0;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--muted);font-family:var(--mono);font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .1s,background .12s,color .12s}
.quick button:active{transform:scale(.96);background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
footer{text-align:center;font-size:10.5px;color:var(--muted);margin-top:20px;line-height:1.75}
.copy{font-size:11.5px;font-weight:650;color:var(--text);margin-bottom:4px}
.tiphint{margin-top:6px;opacity:.72}
footer a{color:var(--accent);text-decoration:none}
.backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:auto;width:100%;max-width:460px;z-index:50;background:var(--surface);border-radius:28px 28px 0 0;max-height:80vh;max-height:80dvh;display:flex;flex-direction:column;box-shadow:var(--sheet-shadow);transform:translateY(103%);transition:transform .28s cubic-bezier(.22,1,.36,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:10px auto 2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px}
.sheet-head h2{font-size:15px;margin:0;font-weight:650}
.close{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);font-size:13px;cursor:pointer}
.searchwrap{padding:0 16px 10px}
.search{width:100%;border:1px solid var(--line);outline:0;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--sans)}
.search:focus{border-color:var(--accent-line)}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 14px}
.item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;border-radius:16px;padding:11px 12px;text-align:left;color:var(--text);cursor:pointer;transition:background .12s}
.item:active{background:var(--surface-2)}
.item.sel{background:var(--accent-soft)}
.item .flag{font-size:22px;width:28px;text-align:center;flex-shrink:0}
.item .code{font-weight:700;font-size:14px;width:42px;font-family:var(--mono);flex-shrink:0}
.item.sel .code{color:var(--accent)}
.item .name{flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tag{font-size:9px;color:var(--muted);background:var(--surface-3);border-radius:999px;padding:3px 7px;flex-shrink:0}
.item .check{color:var(--accent);font-weight:800;font-size:14px;flex-shrink:0}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}
@media (min-width:520px){.app{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu" id="refreshBtn" aria-label="Refresh rates" title="Refresh rates">↻</button>

    <div class="avatar" aria-hidden="true">C</div>
  </header>

  <div class="status" id="status"><span class="dot"></span> Checking rates…</div>

  <main class="card">

    <div class="send-row" id="sendRow" data-drop="send">
      <button class="cur-pill active" id="fromBtn" data-pick="from" aria-label="Choose currency you send">
        <span class="flag" id="fromFlag">🇬🇧</span><span class="code" id="fromCode">GBP</span><span class="chev">▾</span>
      </button>
      <input id="fromAmount" class="amt" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="100" aria-label="Amount to send">

    <div class="swap-wrap"><button id="swapBtn" class="swap-btn" aria-label="Swap with first result" title="Swap with first result">⇅</button></div>

    <div class="results-head"><span class="title">You receive</span><span class="badge">3 currencies</span></div>

    <div class="rrow" id="rrow0" data-drop-row="0">
      <button class="cur-pill" id="toBtn0" data-pick="0" aria-label="Choose first receive currency"><span class="flag" id="flag0">🇬🇭</span><span class="code" id="code0">GHS</span><span class="chev">▾</span></button>
      <div class="rright"><div class="ramt" id="rAmt0">—</div><div class="rrate" id="rRate0"></div></div>
    </div>
    <div class="rrow" id="rrow1" data-drop-row="1">
      <button class="cur-pill" id="toBtn1" data-pick="1" aria-label="Choose second receive currency"><span class="flag" id="flag1">🇨🇦</span><span class="code" id="code1">CAD</span><span class="chev">▾</span></button>
      <div class="rright"><div class="ramt" id="rAmt1">—</div><div class="rrate" id="rRate1"></div></div>
    </div>
    <div class="rrow" id="rrow2" data-drop-row="2">
      <button class="cur-pill" id="toBtn2" data-pick="2" aria-label="Choose third receive currency"><span class="flag" id="flag2">🇺🇸</span><span class="code" id="code2">USD</span><span class="chev">▾</span></button>
      <div class="rright"><div class="ramt" id="rAmt2">—</div><div class="rrate" id="rRate2"></div></div>
    </div>
  </main>

  <div class="quick" aria-label="Quick amounts">
    <button type="button" data-amt="1">1</button>
    <button type="button" data-amt="10">10</button>
    <button type="button" data-amt="100">100</button>
    <button type="button" data-amt="1000">1,000</button>
  </div>

  <footer>
    <div class="copy">© Cohby consulting services</div>
    Rates via <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">exchangerate-api.com</a> · works offline with saved rates
    <div class="tiphint">Tip: drag a currency up onto “You send” to swap them</div>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Select currency</h2><button class="close" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="searchwrap"><input class="search" id="search" type="search" placeholder="Search name or code…" autocomplete="off" spellcheck="false"></div>
  <div class="list" id="currencyList"></div>
</div>

const API = "https://open.er-api.com/v6/latest/USD";
const KEY = "cohby-currency-v2";
const $ = id => document.getElementById(id);
const fromAmt = $("fromAmount");
const backdrop = $("backdrop"), sheet = $("sheet"), search = $("search"), list = $("currencyList");
let rates = {}, updated = "", live = false;
let fromCode = "GBP", toCodes = ["GHS", "CAD", "USD"], pickerTarget = null;

function nameOf(c){ return META[c] ? META[c][0] : c; }
function flagOf(c){ return META[c] ? META[c][1] : "🏳️"; }
function fmt(v){
  if(!isFinite(v)) return "0";
  const a = Math.abs(v);
  const d = a === 0 ? 2 : a < 0.01 ? 6 : a < 1 ? 5 : a < 100 ? 4 : 2;
  return v.toLocaleString("en-US", { maximumFractionDigits: d });
}
function rateFmt(v){
  const a = Math.abs(v), d = a >= 100 ? 2 : a >= 1 ? 4 : 6;
  return v.toLocaleString("en-US", { maximumFractionDigits: d });
}
function prettyDate(s){
  const d = new Date(s);
  return isNaN(d) ? (s || "") : d.toLocaleString(undefined, { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
}
function setStatus(){
  const s = $("status");
  s.className = "status" + (live ? "" : " offline");
  s.innerHTML = '<span class="dot"></span> ' + (live ? "Live rates · updated " + updated : "Offline · saved rates from " + updated);
}
function syncLabels(){
  $("fromFlag").textContent = flagOf(fromCode);
  $("fromCode").textContent = fromCode;
  $("fromName").textContent = nameOf(fromCode);
  $("fromBtn").setAttribute("aria-label", "Choose currency you send, currently " + nameOf(fromCode));
  toCodes.forEach((c, i) => {
    $("flag" + i).textContent = flagOf(c);
    $("code" + i).textContent = c;
    $("toBtn" + i).setAttribute("aria-label", "Choose receive currency, currently " + nameOf(c));
  });
}
function validCodes(){
  const codes = Object.keys(rates).sort();
  const used = new Set([fromCode]);
  toCodes = toCodes.map(c => {
    if(used.has(c)){
      const alt = codes.find(x => !used.has(x));
      if(alt){ used.add(alt); c = alt; }
    }
    used.add(c);
    return c;
  });
}
function computeAll(){
  const amt = parseFloat(fromAmt.value.replace(/,/g, "")) || 0;
  if(!rates[fromCode]) return;
  toCodes.forEach((t, i) => {
    if(!rates[t]) return;
    const r = rates[t] / rates[fromCode];
    $("rAmt" + i).textContent = fmt((amt / rates[fromCode]) * rates[t]);
    $("rRate" + i).textContent = "1 " + fromCode + " = " + rateFmt(r) + " " + t;
  });
  $("fromName").textContent = nameOf(fromCode);
}
function clean(el){
  let v = el.value.replace(/[^\d.]/g, "");
  const p = v.indexOf(".");
  if(p !== -1) v = v.slice(0, p + 1) + v.slice(p + 1).replace(/\./g, "");
  if(v.length > 18) v = v.slice(0, 18);
  el.value = v;
}
function savePrefs(){
  try{ localStorage.setItem(KEY + "-prefs", JSON.stringify({ from:fromCode, to:toCodes, amt:fromAmt.value })); }catch(e){}
}
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(KEY + "-prefs")) || {}; }catch(e){ return {}; } }
function loadCache(){
  try{
    const c = JSON.parse(localStorage.getItem(KEY));
    if(c && c.rates && Object.keys(c.rates).length > 10){ rates = c.rates; updated = c.updated || ""; live = false; }
    else throw 0;
  }catch(e){ rates = FALLBACK.rates; updated = prettyDate(FALLBACK.date); live = false; }
}
async function fetchRates(){
  const btn = $("refreshBtn");
  btn.style.opacity = ".5";
  try{
    const res = await fetch(API, { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if(d.result !== "success" || !d.rates || !d.rates.USD) throw new Error("bad data");
    rates = d.rates; updated = prettyDate(d.time_last_update_utc); live = true;
    try{ localStorage.setItem(KEY, JSON.stringify({ rates:rates, updated:updated, saved:Date.now() })); }catch(e){}
  }catch(e){ loadCache(); }
  finally{
    btn.style.opacity = "";
    validCodes(); syncLabels(); setStatus(); computeAll();
  }
}
function setFromCode(v){
  const j = toCodes.indexOf(v);
  if(j !== -1) toCodes[j] = fromCode;
  fromCode = v;
  validCodes(); syncLabels(); computeAll(); savePrefs();
}
function setToCode(i, v){
  if(v === fromCode){ fromCode = toCodes[i]; }
  else{
    const j = toCodes.findIndex((x, k) => k !== i && x === v);
    if(j !== -1) toCodes[j] = toCodes[i];
  }
  toCodes[i] = v;
  validCodes(); syncLabels(); computeAll(); savePrefs();
}

function openPicker(target){
  pickerTarget = target;
  $("sheetTitle").textContent = target === "from" ? "Currency you send" : "Choose receive currency";
  search.value = "";
  renderList("");
  backdrop.classList.add("show"); sheet.classList.add("show");
  setTimeout(() => search.focus(), 280);
}
function closePicker(){
  backdrop.classList.remove("show"); sheet.classList.remove("show");
  if(document.activeElement === search) search.blur();
}
function renderList(q){
  const query = q.trim().toLowerCase();
  const codes = Object.keys(rates).filter(c =>
    !query || c.toLowerCase().includes(query) || nameOf(c).toLowerCase().includes(query));
  if(query){
    const score = c => {
      const n = nameOf(c).toLowerCase();
      if(c.toLowerCase() === query) return 0;
      if(n === query) return 1;
      if(c.toLowerCase().startsWith(query)) return 2;
      if(n.startsWith(query)) return 3;
      return 4;
    };
    codes.sort((a, b) => score(a) - score(b) || (a < b ? -1 : 1));
  }
  if(!codes.length){ list.innerHTML = '<div class="empty">No currencies found</div>'; return; }
  const current = pickerTarget === "from" ? fromCode : toCodes[pickerTarget];
  list.innerHTML = codes.map(c => {
    const selected = c === current;
    const used = pickerTarget === "from"
      ? toCodes.includes(c)
      : (c === fromCode || toCodes.some((x, i) => i !== pickerTarget && x === c));
    const tail = selected ? '<span class="check">✓</span>' : used ? '<span class="tag">in use</span>' : '';
    return '<button type="button" class="item' + (selected ? " sel" : "") + '" data-code="' + c + '">' +
      '<span class="flag">' + flagOf(c) + '</span><span class="code">' + c + '</span>' +
      '<span class="name">' + nameOf(c) + '</span>' + tail + '</button>';
  }).join("");
}
let drag = null, suppressClick = false;
const DRAG_THRESHOLD = 8;
function clearDropHighlights(){
  document.querySelectorAll(".drop-active").forEach(el => el.classList.remove("drop-active"));
}
function flashSwap(el){
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 600);
}
function swapWithSend(i){
  setFromCode(toCodes[i]);
  flashSwap($("sendRow"));
  const row = $("rrow" + i);
  if(row) flashSwap(row);
}
function onDragStart(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  const pill = e.currentTarget;
  drag = { pill:pill, source:pill.dataset.pick, startX:e.clientX, startY:e.clientY,
           x:e.clientX, y:e.clientY, moved:false, ghost:null, target:null };
  try{ pill.setPointerCapture(e.pointerId); }catch(err){}
  pill.addEventListener("pointermove", onDragMove);
  pill.addEventListener("pointerup", onDragEnd);
  pill.addEventListener("pointercancel", onDragEnd);
}
function onDragMove(e){
  if(!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if(!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > DRAG_THRESHOLD){
    drag.moved = true;
    const g = drag.pill.cloneNode(true);
    g.removeAttribute("id");
    g.classList.add("drag-ghost");
    document.body.appendChild(g);
    drag.ghost = g;
    drag.pill.classList.add("is-dragging");
    document.body.classList.add("dragging-active");
  }
  if(!drag.moved) return;
  if(e.cancelable) e.preventDefault();
  drag.ghost.style.left = drag.x + "px";
  drag.ghost.style.top = drag.y + "px";
  const el = document.elementFromPoint(drag.x, drag.y);
  const zone = el && el.closest("[data-drop='send']");
  const row = el && el.closest("[data-drop-row]");
  const target = zone ? "send" : (row ? row.dataset.dropRow : null);
  if(drag.target !== target){
    clearDropHighlights();
    drag.target = target;
    if(target === "send") $("sendRow").classList.add("drop-active");
    else if(target !== null){ const r = $("rrow" + target); if(r) r.classList.add("drop-active"); }
  }
}
function onDragEnd(e){
  if(!drag) return;
  const d = drag;
  d.pill.removeEventListener("pointermove", onDragMove);
  d.pill.removeEventListener("pointerup", onDragEnd);
  d.pill.removeEventListener("pointercancel", onDragEnd);
  try{ d.pill.releasePointerCapture(e.pointerId); }catch(err){}
  if(d.moved){
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 400);
    if(d.target === "send" && d.source !== "from") swapWithSend(Number(d.source));
    else if(d.target !== "send" && d.target !== null && d.source === "from") swapWithSend(Number(d.target));
    if(d.ghost){
      const g = d.ghost;
      g.classList.add("ghost-out");
      setTimeout(() => g.remove(), 180);
    }
    d.pill.classList.remove("is-dragging");
    document.body.classList.remove("dragging-active");
    clearDropHighlights();
  }
  drag = null;
}
document.querySelectorAll("[data-pick]").forEach(pill => {
  pill.addEventListener("pointerdown", onDragStart);
  pill.addEventListener("click", () => {
    if(suppressClick){ suppressClick = false; return; }
    openPicker(pill.dataset.pick);
  });
});
list.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if(!b) return;
  const v = b.dataset.code;
  if(pickerTarget === "from") setFromCode(v); else setToCode(pickerTarget, v);
  closePicker();
});
search.addEventListener("input", () => renderList(search.value));
backdrop.addEventListener("click", closePicker);
$("sheetClose").addEventListener("click", closePicker);
document.addEventListener("keydown", e => { if(e.key === "Escape") closePicker(); });

fromAmt.addEventListener("input", () => { clean(fromAmt); computeAll(); savePrefs(); });
$("swapBtn").addEventListener("click", () => {
  const f = fromCode; fromCode = toCodes[0]; toCodes[0] = f;
  validCodes(); syncLabels(); computeAll(); savePrefs();
});
$("refreshBtn").addEventListener("click", fetchRates);
document.querySelectorAll(".quick button").forEach(b => b.addEventListener("click", () => { fromAmt.value = b.dataset.amt; computeAll(); savePrefs(); }));
window.addEventListener("online", fetchRates);

(function init(){
  loadCache();
  const p = loadPrefs();
  fromCode = p.from && rates[p.from] ? p.from : (rates.GBP ? "GBP" : "USD");
  const defaults = ["GHS", "CAD", "USD"];
  const saved = Array.isArray(p.to) ? p.to : (typeof p.to === "string" ? [p.to] : []);
  toCodes = defaults.map((d, i) => saved[i] && rates[saved[i]] ? saved[i] : d);
  fromAmt.value = p.amt || "100";
  validCodes(); syncLabels(); setStatus(); computeAll();
  fetchRates();
  setInterval(fetchRates, 30 * 60 * 1000);
})();
</script>
